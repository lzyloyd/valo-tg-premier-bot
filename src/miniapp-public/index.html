<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Расписание Overthinkers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0b0f16; --surface:#141b26; --surface-2:#1b2430; --surface-3:#232d3a;
  --text:#eef2f6; --text-muted:#7383a3; --border:#232d3a;
  --accent:#ff5a68; --on:#3ddb8a; --on-bg:rgba(61,219,138,.16);
  --warn:#ffd166; --warn-bg:rgba(255,209,102,.12); --warn-border:rgba(255,209,102,.3);
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.app-header{padding:14px 16px 2px;background:var(--surface);}
.team-switch{display:flex;gap:4px;padding:4px;margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:13px;}
.team-switch-btn{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--text-muted);font:700 12px 'Manrope',sans-serif;cursor:pointer;transition:background .15s,color .15s,border-color .15s;-webkit-tap-highlight-color:transparent;}
.team-switch-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-switch-btn::before{content:'';width:6px;height:6px;flex-shrink:0;border-radius:50%;background:currentColor;opacity:.35;}
.team-switch-btn.active{background:rgba(255,90,104,.12);border-color:rgba(255,90,104,.25);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.12);}
.team-switch-btn.active::before{opacity:1;}
.team-switch-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media(hover:hover){.team-switch-btn:not(.active):hover{background:var(--surface-2);color:var(--text);}}
@media(prefers-reduced-motion:reduce){.team-switch-btn{transition:none;}}
.app-header-title{font-weight:800;font-size:16px;}
.app-header-sub{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.tabs{display:flex;gap:4px;padding:10px 12px 0;background:var(--surface);position:sticky;top:0;z-index:2;}
.tab{flex:1;border:none;background:none;color:var(--text-muted);font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;padding:9px 4px 12px;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.screen{padding:16px;flex:1;}
.day-list{display:flex;flex-direction:column;gap:8px;}
.day-card{border:1px solid var(--border);border-radius:12px;padding:18px 12px;display:grid;grid-template-columns:84px 1fr 138px;align-items:center;gap:6px;background:var(--surface);}
.day-name{font-weight:700;font-size:13px;}
.day-date{font-size:10.5px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.day-kind{font-size:9.5px;color:var(--text-muted);margin-top:3px;white-space:normal;overflow-wrap:anywhere;line-height:1.5;}
.avail-toggle{display:flex;flex-direction:column;gap:4px;justify-self:center;align-items:stretch;}
.slots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.avail-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);font-family:'Manrope',sans-serif;font-weight:700;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.avail-btn.yes.active{background:var(--on-bg);border-color:var(--on);color:var(--on);}
.avail-btn.no.active{background:var(--surface-3);border-color:var(--text-muted);color:var(--text);}
.slot-chip{border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:10.5px;padding:6px 5px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.slot-chip.on{background:var(--on-bg);border-color:var(--on);color:var(--on);}
.slot-chip.dim{opacity:.35;}
.save-status{margin-top:14px;font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;text-align:center;}
.variant-switch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
.variant-switch>span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.seg{display:flex;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px;}
.seg-btn{border:none;background:none;color:var(--text-muted);font-weight:700;font-size:10.5px;padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;}
.seg-btn.active{background:var(--surface);color:var(--text);}
.team-grid{border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.team-row{display:grid;grid-template-columns:56px repeat(var(--day-count,7),minmax(0,1fr));border-top:1px solid var(--border);min-height:150px;align-items:center;}
.team-row:first-child{border-top:none;background:var(--surface-2);min-height:0;}
.team-row>div{padding:12px 4px;font-size:10.5px;}
.team-row>div:last-child{padding-right:14px;}
.team-day{font-weight:700;font-size:11px;text-align:center;}
.team-date{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);text-align:center;}
.avatars{display:flex;flex-direction:column;align-items:center;gap:4px;}
.avatar{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:7.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.avatar.dim{background:var(--surface-3);color:var(--text-muted);}
.count-badge{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;background:var(--surface-3);color:var(--text-muted);}
.count-badge.quorum{background:var(--on-bg);color:var(--on);}
.pips-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.pips-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);}
.pips{display:flex;flex-direction:column-reverse;gap:3px;justify-content:center;align-items:center;}
.pip{width:20px;height:6px;border-radius:2px;background:var(--surface-3);}
.pip.filled{background:var(--on);opacity:.4;}
.pip.filled.quorum{opacity:1;}
.admin-lock{font-size:10.5px;color:var(--text-muted);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin-bottom:14px;}
.dayoff-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.dayoff-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);font-family:'Manrope',sans-serif;font-weight:700;font-size:11px;padding:8px 11px;border-radius:8px;cursor:pointer;}
.dayoff-btn.active{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn);}
.dayoff-btn[disabled]{opacity:.5;cursor:not-allowed;}
.day-card.day-off{opacity:.55;}
.day-off-label{grid-column:2 / span 2;text-align:center;font-size:12px;font-weight:700;color:var(--warn);}
.admin-progress{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.admin-progress .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;}
.admin-progress .lbl{font-size:10.5px;color:var(--text-muted);}
.send-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:13px;cursor:pointer;margin-bottom:16px;}
.send-btn[disabled]{opacity:.5;}
.section-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin-bottom:8px;}
.tg-bubble-wrap{background:var(--bg);border-radius:12px;padding:14px 12px;margin-bottom:6px;}
.tg-bubble{background:var(--surface-2);border-radius:0 12px 12px 12px;padding:10px 12px;white-space:pre-wrap;font-size:12.5px;line-height:1.6;}
.alert-item{border:1px solid var(--warn-border);background:var(--warn-bg);border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:12px;}
.empty-note{font-size:11.5px;color:var(--text-muted);}
.attendance-list{display:flex;flex-direction:column;gap:8px;}
.attendance-row{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:var(--surface);}
.attendance-name{font-weight:700;font-size:12px;flex:0 0 96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attendance-count{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:var(--text-muted);flex:0 0 30px;}
.attendance-count.maxed{color:var(--accent);}
.attendance-opts{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:flex-end;}
.miss-btn{border:1px solid var(--accent);background:rgba(255,90,104,.12);color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10.5px;padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.miss-btn[disabled]{opacity:.5;cursor:not-allowed;}
.loading{padding:40px;text-align:center;color:var(--text-muted);}

.screen-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;}
.screen-heading h2{font-size:16px;margin:0;font-weight:800;}.screen-heading p{margin:4px 0 0;color:var(--text-muted);font-size:11px;}
.soft-btn{border:1px solid rgba(255,90,104,.25);background:rgba(255,90,104,.09);color:var(--accent);border-radius:10px;padding:10px 12px;min-height:40px;font:700 11px 'Manrope',sans-serif;cursor:pointer;white-space:nowrap;}
.day-card{grid-template-columns:minmax(0,1fr) auto minmax(0,1.55fr);gap:8px;padding:18px 12px;}.day-card .day-id{min-width:0;}.day-card .avail-toggle{grid-column:2;grid-row:1;justify-self:center;}.day-card .slots{grid-column:3;grid-row:1;align-self:center;}.day-card.day-off{grid-template-columns:minmax(0,1fr) auto;}.day-card .day-name{overflow-wrap:anywhere;}
@media(max-width:360px){.day-card:not(.day-off){grid-template-columns:auto minmax(0,1fr);gap:12px;}.day-card:not(.day-off) .day-id{grid-column:1 / -1;}.day-card .avail-toggle{grid-column:1;grid-row:2;}.day-card .slots{grid-column:2;grid-row:2;}}
.day-card.day-off{opacity:1;background:rgba(20,27,38,.55);}.day-card.day-off .day-id{opacity:.65;}.day-card.day-off .day-off-label{grid-column:2;grid-row:1;text-align:right;font-size:11px;}
.roster-section{margin-bottom:22px;}.roster-label{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;color:var(--text-muted);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}.roster-label b{background:var(--surface-3);border-radius:5px;padding:3px 6px;font:600 10px 'JetBrains Mono',monospace;}
.roster-list{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--surface);}.roster-player{display:flex;align-items:center;gap:8px;padding:11px 10px;border-top:1px solid var(--border);}.roster-player:first-child{border-top:0;}.player-mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font:700 10px 'JetBrains Mono',monospace;color:var(--text-muted);background:var(--surface-2);}.player-mark.reserve{color:var(--warn);background:var(--warn-bg);}.player-details{min-width:0;flex:1;}.player-name{font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.player-caption{font-size:9px;color:var(--text-muted);margin-top:3px;}.player-actions{display:flex;align-items:center;gap:4px;}.player-btn{min-height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text-muted);font:700 10px 'Manrope',sans-serif;padding:6px 8px;cursor:pointer;}.player-btn.remove{font-size:18px;border-color:transparent;background:transparent;color:var(--text-muted);padding:2px 7px;}.player-btn:disabled{opacity:.25;cursor:default;}.priority-controls{display:flex;gap:3px;margin-top:6px;}.priority-controls .player-btn{min-height:28px;padding:2px 9px;font-size:14px;}.roster-hint{font-size:10px;color:var(--text-muted);line-height:1.6;margin:9px 0 0;}
dialog{width:calc(100% - 24px);max-width:440px;max-height:90dvh;overflow-y:auto;margin:auto;border:1px solid var(--border);border-radius:22px;padding:24px 20px 20px;background:var(--surface);color:var(--text);box-shadow:0 24px 100px rgba(0,0,0,.6);font-family:'Manrope',sans-serif;}dialog::backdrop{background:rgba(4,7,12,.78);backdrop-filter:blur(5px);}.modal-top{display:flex;align-items:start;justify-content:space-between;gap:12px;}.modal-title{font-size:20px;letter-spacing:-.03em;font-weight:800;margin:0;}.modal-sub{color:var(--text-muted);font-size:11px;margin:6px 0 22px;line-height:1.6;}.modal-close{border:none;background:var(--surface-2);color:var(--text-muted);border-radius:50%;width:30px;height:30px;font-size:20px;cursor:pointer;flex-shrink:0;}.field-label{display:block;margin:18px 0 9px;color:var(--text-muted);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.07em;}.modal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}.modal-day{min-width:0;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);border-radius:10px;padding:10px 1px;font:700 11px 'Manrope',sans-serif;cursor:pointer;}.modal-day small{display:block;font:500 9px 'JetBrains Mono',monospace;margin-top:5px;opacity:.7;}.modal-day.active,.role-choice.active{border-color:rgba(255,90,104,.5);background:rgba(255,90,104,.12);color:var(--accent);}.modal-day:disabled{opacity:.25;cursor:default;}.modal-input{width:100%;min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);padding:14px;font:600 15px 'Manrope',sans-serif;outline:none;color-scheme:dark;}.modal-input:focus{border-color:var(--accent);}.time-field{font:600 32px 'JetBrains Mono',monospace;letter-spacing:.03em;text-align:center;}.modal-note{display:flex;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;color:var(--text-muted);font-size:11px;line-height:1.6;margin:16px 0;}.modal-note b{color:var(--text);font-weight:600;}.modal-submit{width:100%;border:none;border-radius:12px;background:var(--accent);color:#fff;min-height:46px;font:800 13px 'Manrope',sans-serif;cursor:pointer;margin-top:8px;}.modal-submit:disabled{opacity:.5;}.modal-error{font-size:11px;line-height:1.6;color:var(--accent);margin-top:12px;}.role-choices{display:flex;gap:8px;}.role-choice{flex:1;text-align:left;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);padding:13px;border-radius:12px;font:800 12px 'Manrope',sans-serif;cursor:pointer;}.role-choice small{display:block;font-size:10px;font-weight:500;opacity:.75;margin-top:5px;}.soft-btn:focus-visible,.player-btn:focus-visible,.modal-day:focus-visible,.role-choice:focus-visible,.modal-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.time-picker{display:flex;align-items:center;justify-content:center;position:relative;gap:6px;height:134px;border:1px solid var(--border);border-radius:14px;background:var(--bg);padding:0 50px 0 12px;}.time-picker:focus-within{border-color:var(--accent);}.time-wheels{position:relative;display:flex;align-items:center;gap:4px;}.time-wheels::before{content:'';position:absolute;left:0;right:0;top:44px;height:44px;background:var(--surface-2);border-radius:9px;pointer-events:none;}.time-wheel{position:relative;width:66px;height:132px;overflow-y:auto;padding:44px 0;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;touch-action:pan-y;scrollbar-width:none;outline:none;mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);}.time-wheel::-webkit-scrollbar{display:none;}.time-wheel:focus-visible{background:rgba(255,90,104,.08);border-radius:9px;}.time-wheel-row{height:44px;display:grid;place-items:center;scroll-snap-align:center;font:600 25px 'JetBrains Mono',monospace;color:var(--text-muted);opacity:.5;cursor:pointer;user-select:none;}.time-wheel-row.selected{color:var(--text);font-size:31px;opacity:1;}.time-colon{position:relative;font:600 28px 'JetBrains Mono',monospace;margin-top:-4px;}.native-time{position:absolute;right:12px;width:36px;height:44px;}.native-time input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color:transparent;color-scheme:dark;cursor:pointer;outline:none;}.native-time input::-webkit-datetime-edit{display:none;}.native-time input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer;}.native-time svg{position:absolute;left:5px;top:9px;width:26px;height:26px;pointer-events:none;color:var(--text);}.native-time input:focus-visible{outline:2px solid var(--accent);border-radius:8px;}

<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<dialog id="editModal" aria-labelledby="modalTitle"></dialog>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
const initData = tg?.initData || '';

const selectedTeamId = new URLSearchParams(location.search).get('team') || undefined;
let state = null;
let activeTab = 'me';
let teamMode = 'avatars';
let draft = {}; // local edits before they round-trip, keyed by day
let saveStatusText = 'Изменения сохраняются автоматически';

function formatTime(date) {
  return date.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
}

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, teamId: selectedTeamId, ...body }),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Ошибка запроса');
  return json;
}

function initials(name) {
  return name.replace(/[^A-Za-z0-9]/g, '').slice(0, 2);
}

const DAY_ABBR = { mon: 'Пн', tue: 'Вт', wed: 'Ср', thu: 'Чт', fri: 'Пт', sat: 'Сб', sun: 'Вс' };
const SHORT_MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const FULL_MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

function dateParts(dateIso) {
  const [, m, d] = dateIso.split('-').map(Number);
  return { day: d, month: m };
}

function shortDate(dateIso) {
  const { day, month } = dateParts(dateIso);
  return `${day} ${SHORT_MONTHS[month - 1]}`;
}

function weekLabel(days) {
  const first = days[0];
  const last = days.at(-1);
  return `${DAY_ABBR[first.key]} ${dateParts(first.dateIso).day} — ${DAY_ABBR[last.key]} ${dateParts(last.dateIso).day} ${FULL_MONTHS[dateParts(last.dateIso).month - 1]}`;
}

function applyLastSaved() {
  if (state.me.lastSaved) {
    saveStatusText = `Сохранено автоматически · ${formatTime(new Date(state.me.lastSaved))} МСК`;
  }
}

function rebuildDraft() {
  draft = {};
  for (const day of state.days) {
    const mine = state.responses[state.me.username]?.[day.key];
    draft[day.key] = mine ? { avail: mine.avail, slots: [...mine.slots] } : { avail: null, slots: [] };
  }
}

async function loadState() {
  state = await api('/api/state');
  rebuildDraft();
  applyLastSaved();
  render();
}

const POLL_MS = 5000;
let pollTimer = null;

// A background refresh normally only touches `state` (what "Команда"/"Админ"
// show) — never `draft` — so it can't clobber a click on "Расписание" that
// hasn't round-tripped yet. But if the week itself rolled over server-side
// (Sunday's reset) while the app sat open, `draft` would otherwise keep
// showing the old week's selections forever; only rebuild it when that
// actually happens.
async function refreshState() {
  try {
    const previousWeekStart = state?.days?.[0]?.dateIso;
    state = await api('/api/state');
    if (state.days[0].dateIso !== previousWeekStart) {
      rebuildDraft();
      applyLastSaved();
    }
    render();
  } catch (err) {
    console.error('[schedule] background refresh failed:', err);
  }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(refreshState, POLL_MS);
}

function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopPolling();
  } else {
    refreshState();
    startPolling();
  }
});

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderHeader() {
  return `<div class="app-header">
    <div class="app-header-title">${escapeHtml(state.team.name)}</div>

function renderMeScreen() {
  const cards = state.days.map(d => {
    const off = state.daysOff.includes(d.key);
    const identity = '<div class="day-id"><div class="day-name">' + d.label + '</div><div class="day-date">' + shortDate(d.dateIso) + '</div><div class="day-kind">' + (off ? 'Без сборов' : escapeHtml(d.kind)) + '</div></div>';

function availableFor(day, slot) {
  return state.roster.filter((u) => {
    const r = state.responses[u]?.[day];
    return r?.avail === 'yes' && r.slots.includes(slot);
  });
}

function teamCell(names) {
  const met = names.length >= state.quorum;
  if (teamMode === 'count') {
    if (names.length === 0) return `<div class="count-badge">0</div>`;
    return `<div class="count-badge${met ? ' quorum' : ''}">${names.length}</div>`;
  }
  if (teamMode === 'pips') {
    const pips = state.roster.map((_, i) => `<div class="pip${i < names.length ? ' filled' + (met ? ' quorum' : '') : ''}"></div>`).join('');
    return `<div class="pips-wrap"><div class="pips-count">${names.length}</div><div class="pips">${pips}</div></div>`;
  }
  if (names.length === 0) return `<div class="avatars"><span class="avatar dim">—</span></div>`;
  return `<div class="avatars">${names.map((n) => `<span class="avatar" title="${n}">${initials(n)}</span>`).join('')}</div>`;
}

  const header = `<div class="team-row"><div></div>${state.days

      .map((d) => {

function render() {
  const root = document.getElementById('app');
  const screen = activeTab === 'me' ? renderMeScreen() : activeTab === 'team' ? renderTeamScreen() : renderAdminScreen();
  root.innerHTML = renderHeader() + renderTabs() + screen;
  bindEvents();
}

function bindEvents() {
  document.querySelectorAll('[data-remove-time]').forEach(btn => btn.addEventListener('click', () => openEditor('remove-time', {day:btn.dataset.day,time:btn.dataset.removeTime,weekStart:state.weekStart})));
  document.querySelectorAll('[data-add-time]').forEach(btn => btn.addEventListener('click', () => openEditor('time', {day:btn.dataset.addTime})));
  document.getElementById('addPlayer')?.addEventListener('click', () => openEditor('player'));
  document.querySelectorAll('[data-roster-action]').forEach(btn => btn.addEventListener('click', async () => {
    const data = {action:btn.dataset.rosterAction, username:btn.dataset.username, role:btn.dataset.role, direction:btn.dataset.direction};
    if (data.action === 'remove') return openEditor('remove', data);
    btn.disabled = true;
    try { state = await api('/api/roster', data); rebuildDraft(); render(); }
    catch (err) { tg?.showAlert ? tg.showAlert(err.message) : alert(err.message); btn.disabled = false; }
  }));
  document.querySelectorAll('[data-team-id]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.teamId === state.team.id) return;
    const url = new URL(location.href);
    url.searchParams.set('team', btn.dataset.teamId);
    location.assign(url.href);
  }));
  document.querySelectorAll('.tab').forEach((btn) => btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); }));
  document.querySelectorAll('[data-teammode]').forEach((btn) => btn.addEventListener('click', () => { teamMode = btn.dataset.teammode; render(); }));

  document.querySelectorAll('.avail-btn').forEach((btn) =>
    btn.addEventListener('click', async () => {
      const day = btn.dataset.day;
      // Tapping an active "не могу" again clears the answer.
      draft[day].avail = draft[day].avail === 'no' ? null : 'no';
      draft[day].slots = [];
      render();
      await saveDay(day);
    }),
  );
  // Picking any time means "могу"; un-picking the last one clears the answer.
  document.querySelectorAll('.slot-chip[data-slot]').forEach((btn) =>
    btn.addEventListener('click', async () => {
      const day = btn.dataset.day;
      const t = btn.dataset.slot;
      const current = draft[day].avail === 'yes' ? draft[day].slots : [];
      const slots = current.includes(t) ? current.filter((x) => x !== t) : [...current, t];
      draft[day].slots = slots;
      draft[day].avail = slots.length ? 'yes' : null;
      render();
      await saveDay(day);
    }),
  );

  document.querySelectorAll('.dayoff-btn').forEach((btn) =>
    btn.addEventListener('click', async () => {
      const day = btn.dataset.day;
      const isOff = btn.dataset.off === '1';
      btn.disabled = true;
      try {
        state = await api('/api/set-day-off', { day, isOff });
        render();
      } catch (err) {
        tg?.showAlert?.(err.message) ?? alert(err.message);
        btn.disabled = false;
      }
    }),
  );

  document.querySelectorAll('.miss-btn').forEach((btn) =>
    btn.addEventListener('click', () => {
      const username = btn.dataset.username;
      const dayKey = btn.dataset.day;
      const slot = btn.dataset.slot;
      const dayLabel = state.days.find((d) => d.key === dayKey)?.label ?? dayKey;
      const question = `Отметить @${username} как не пришедшего на ${dayLabel} ${slot} (${btn.dataset.kind})?\nВ «Сборы» сразу уйдёт предупреждение.`;
      const markMiss = async () => {
        btn.disabled = true;
        try {
          state = await api('/api/mark-miss', { username, dayKey, slot });
          render();
        } catch (err) {
          tg?.showAlert?.(err.message) ?? alert(err.message);
          btn.disabled = false;
        }
      };
      if (tg?.showConfirm) {
        tg.showConfirm(question, (ok) => { if (ok) markMiss(); });
      } else if (confirm(question)) {
        markMiss();
      }
    }),
  );

  document.getElementById('sendBtn')?.addEventListener('click', async (e) => {
    e.target.disabled = true;
    e.target.textContent = 'Отправляю…';
    try {
      await api('/api/send-summary');
      e.target.textContent = 'Отправлено ✓';
    } catch (err) {
      tg?.showAlert?.(err.message) ?? alert(err.message);
      e.target.textContent = 'Отправить сводку в «Сборы»';
      e.target.disabled = false;
    }
  });
}

function renderTimePicker() {
  const column = (unit, count, label) => '<div class="time-wheel" data-time-unit="' + unit + '" tabindex="0" role="spinbutton" aria-label="' + label + '" aria-valuemin="0" aria-valuemax="' + (count - 1) + '">' + Array.from({length:count},(_,i)=>'<div class="time-wheel-row" data-value="' + i + '" aria-hidden="true">' + String(i).padStart(2,'0') + '</div>').join('') + '</div>';
  return '<div class="time-picker"><div class="time-wheels">' + column('hour',24,'Часы') + '<span class="time-colon" aria-hidden="true">:</span>' + column('minute',60,'Минуты') + '</div><div class="native-time"><input id="customTime" name="time" type="time" value="20:30" step="60" required aria-label="Обычный выбор времени"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 5.5v7l4 2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>';
}
function setupTimePicker() {
  const input = editModal.querySelector('#customTime');
  if (!input) return;
  const wheels = [...editModal.querySelectorAll('.time-wheel')];
  const valueOf = wheel => Math.max(0, Math.min(Number(wheel.getAttribute('aria-valuemax')), Math.round(wheel.scrollTop / 44)));
  function mark(wheel, value) {
    wheel.setAttribute('aria-valuenow',value);
    wheel.setAttribute('aria-valuetext',String(value).padStart(2,'0'));
    wheel.querySelectorAll('.time-wheel-row').forEach(row=>row.classList.toggle('selected',Number(row.dataset.value) === value));
  }
  function readNative() {
    if (!input.value) return;
    input.value.split(':').forEach((part,i)=>{ wheels[i].scrollTop=Number(part)*44; mark(wheels[i],Number(part)); });
  }
  wheels.forEach(wheel => {
    wheel.addEventListener('scroll',()=>{
      mark(wheel,valueOf(wheel));
      input.value = wheels.map(w=>String(valueOf(w)).padStart(2,'0')).join(':');
    },{passive:true});
    wheel.addEventListener('click',e=>{
      const row=e.target.closest('[data-value]');
      if(row) wheel.scrollTo({top:Number(row.dataset.value)*44,behavior:'smooth'});
    });
    wheel.addEventListener('keydown',e=>{
      const value=valueOf(wheel);
      const targets={ArrowUp:value-1,ArrowDown:value+1,PageUp:value-5,PageDown:value+5,Home:0,End:Number(wheel.getAttribute('aria-valuemax'))};
      if (targets[e.key] == null) return;
      e.preventDefault();
      wheel.scrollTop=Math.max(0,Math.min(Number(wheel.getAttribute('aria-valuemax')),targets[e.key]))*44;
    });
  });
  input.addEventListener('input',readNative);
  input.addEventListener('change',readNative);
  readNative();
}

let modalBusy = false;
const editModal = document.getElementById('editModal');
editModal.addEventListener('cancel', e => { if (modalBusy) e.preventDefault(); });
editModal.addEventListener('close', () => { if (!document.hidden) startPolling(); });

  const playerFields = '<label class="field-label" for="playerUsername">Telegram-ник</label><input class="modal-input" id="playerUsername" name="username" placeholder="@username" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="33"><span class="field-label">Роль в команде</span><div class="role-choices"><button type="button" class="role-choice active" data-modal-role="main" aria-pressed="true">Основа<small>Постоянный состав</small></button><button type="button" class="role-choice" data-modal-role="sub" aria-pressed="false">Запас<small>В конце очереди замен</small></button></div><div class="modal-note">Игрок получит доступ к этой команде при первом входе в мини-приложение через Telegram.</div>';
  editModal.innerHTML = '<form id="editorForm"><div class="modal-top"><div><h2 class="modal-title" id="modalTitle">' + title + '</h2><p class="modal-sub">' + sub + '</p></div><button type="button" class="modal-close" aria-label="Закрыть">×</button></div>' + (type === 'time' ? timeFields : type === 'player' ? playerFields : type === 'remove-time' ? '<div class="modal-note">Сбор и выбранные для него отметки будут удалены. Стандартные праки и премьер сохранятся.</div>' : '<div class="modal-note">История посещаемости сохранится. Права администратора задаются отдельно от игрового состава.</div>') + '<div class="modal-error" id="modalError" role="alert"></div><button class="modal-submit" type="submit">' + (type === 'time' ? 'Добавить время' : type === 'player' ? 'Добавить игрока' : type === 'remove-time' ? 'Удалить сбор' : 'Удалить из команды') + '</button></form>';
  let day = data.day;
  let role = 'main';
  editModal.querySelector('.modal-close').onclick = () => { if (!modalBusy) editModal.close(); };
  editModal.querySelectorAll('[data-modal-day]').forEach(btn => btn.onclick = () => { day = btn.dataset.modalDay; editModal.querySelectorAll('[data-modal-day]').forEach(b => { b.classList.toggle('active', b === btn); b.setAttribute('aria-pressed', String(b === btn)); }); });
  editModal.querySelectorAll('[data-modal-role]').forEach(btn => btn.onclick = () => { role = btn.dataset.modalRole; editModal.querySelectorAll('[data-modal-role]').forEach(b => { b.classList.toggle('active', b === btn); b.setAttribute('aria-pressed', String(b === btn)); }); });
  editModal.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    if (modalBusy) return;
    modalBusy = true;
    const submit = editModal.querySelector('.modal-submit'); submit.disabled = true;
    const error = editModal.querySelector('#modalError'); error.textContent = '';
    try {
      const body = type === 'time' ? {day, time:editModal.querySelector('#customTime').value, name:editModal.querySelector('#gatheringName').value, weekStart:state.weekStart} : type === 'player' ? {action:'add', username:editModal.querySelector('#playerUsername').value, role} : data;
      state = await api(type === 'time' ? '/api/add-time' : type === 'remove-time' ? '/api/remove-time' : '/api/roster', body);
      rebuildDraft(); render(); editModal.close();
    } catch (err) { error.textContent = err.message; }
    finally { modalBusy = false; submit.disabled = false; }
  };
  editModal.showModal();
  if (type === 'time') setupTimePicker();
}

async function saveDay(day) {
  const status = document.getElementById('saveStatus');
  try {
    state = await api('/api/update', { day, avail: draft[day].avail, slots: draft[day].slots });
    saveStatusText = `Сохранено автоматически · ${formatTime(new Date())} МСК`;
  } catch (err) {
    saveStatusText = `Не сохранилось: ${err.message}`;
  }
  if (status) status.textContent = saveStatusText;
}

loadState()
  .then(startPolling)
  .catch((err) => {
    document.getElementById('app').innerHTML = `<div class="loading">${err.message}</div>`;
  });
</script>
